<script>
(() => {
const ALL_DISTRICTS = ['Adalar', 'Arnavutköy', 'Ataşehir', 'Avcılar', 'Bağcılar', 'Bahçelievler', 'Bakırköy', 'Başakşehir', 'Bayrampaşa', 'Beşiktaş', 'Beykoz', 'Beylikdüzü', 'Beyoğlu', 'Büyükçekmece', 'Çatalca', 'Çekmeköy', 'Esenler', 'Esenyurt', 'Eyüpsultan', 'Fatih', 'Gaziosmanpaşa', 'Güngören', 'Kadıköy', 'Kağıthane', 'Kartal', 'Küçükçekmece', 'Maltepe', 'Pendik', 'Sancaktepe', 'Sarıyer', 'Silivri', 'Sultanbeyli', 'Sultangazi', 'Şile', 'Şişli', 'Tuzla', 'Ümraniye', 'Üsküdar', 'Zeytinburnu'];
const DISTRICTS = (window.EVINDEX || [{ key: 'kadikoy', name: 'Kadıköy', n: 6287 }, { key: 'umraniye', name: 'Ümraniye', n: 32283 }]);
let DATA, PRE, eng, B, CEN, IDX = [];
const store = {};
async function loadData(key) {
  if (store[key]) return store[key];
  let d = window.EVEMBED && window.EVEMBED[key];
  if (!d) { const r = await fetch('data/' + key + '.json'); if (!r.ok) throw new Error('Veri dosyası açılamadı: ' + key); d = await r.json(); }
  if (d.wk) d.b.forEach(b => { const o = {}; d.wk.forEach((k, j) => { const m = b.w[2 * j]; if (m >= 0) o[k] = [m / 10, d.names[b.w[2 * j + 1]]]; }); b.w = o; });
  const e = new EvEngine(d);
  d.b.forEach((b, i) => { if (fixes[b.id]) { b.lv = fixes[b.id]; b.e = 2; const q = e.B[i]; q.lv = b.lv; q.h = b.lv * 3 + 0.8; q.top = q.g + q.h; } });
  return store[key] = { d, e, cen: e.B.map(b => e.INV((b.minx + b.maxx) / 2, (b.miny + b.maxy) / 2)), idx: d.b.map((b, i) => ({ i, t: norm([b.a, b.nm].filter(Boolean).join(' ')) })).filter(x => x.t) };
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt1 = v => v.toLocaleString('tr-TR', { maximumFractionDigits: 1 });
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const DIRS = ['kuzey', 'kuzeydoğu', 'doğu', 'güneydoğu', 'güney', 'güneybatı', 'batı', 'kuzeybatı'];
const dirName = az => DIRS[Math.round(((az % 360) + 360) % 360 / 45) % 8];
const LOC = { 'kuzey': 'kuzeyde', 'kuzeydoğu': 'kuzeydoğuda', 'doğu': 'doğuda', 'güneydoğu': 'güneydoğuda', 'güney': 'güneyde', 'güneybatı': 'güneybatıda', 'batı': 'batıda', 'kuzeybatı': 'kuzeybatıda' };
const hm = mins => String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(Math.round(mins % 60)).padStart(2, '0');
const dur = h => { if (h <= 0) return 'güneş almıyor'; const H = Math.floor(h), M = Math.round((h - H) * 60); return (H ? H + ' sa' : '') + (M ? (H ? ' ' : '') + M + ' dk' : ''); };
const kname = k => k === 0 ? 'Zemin kat' : k + '. kat';
const GRADE = { 5: 'Pekiyi', 4: 'İyi', 3: 'Orta', 2: 'Geçer', 1: 'Zayıf' };
const nowIst = new Date(Date.now() + 3 * 3600e3);
const DATES = {
  bugun: { label: 'Bugün', y: nowIst.getUTCFullYear(), m: nowIst.getUTCMonth() + 1, d: nowIst.getUTCDate() },
  aralik: { label: '21 Aralık', y: 2026, m: 12, d: 21 },
  mart: { label: '20 Mart', y: 2026, m: 3, d: 20 },
  haziran: { label: '21 Haziran', y: 2026, m: 6, d: 21 }
};

// kullanıcı kat düzeltmeleri (yalnızca bu tarayıcıda)
let fixes = {};
try { fixes = JSON.parse(localStorage.getItem('evk-fixes') || '{}'); } catch (e) { fixes = {}; }
function applyLevels(i, lv) {
  B[i].lv = lv; const b = eng.B[i]; b.lv = lv; b.h = lv * 3 + 0.8; b.top = b.g + b.h; eng.maxTop = Math.max(eng.maxTop, b.top);
}

const S = {
  sel: 0, sample: true, dist: 'kadikoy',
  floor: 0, date: 'aralik', mins: 14 * 60, mode: 'golge', open: false
};
try { const h = location.hash.slice(1); const m = localStorage.getItem('evk-dist'); S.dist = DISTRICTS.some(x => x.key === h) ? h : (DISTRICTS.some(x => x.key === m) ? m : 'kadikoy'); } catch (e) {}
try { const m = localStorage.getItem('evk-mode'); if (m) S.mode = m; } catch (e) {}

// ---------- hesap önbelleği ----------
const cache = new Map();
function prof(i, key) {
  const k = i + '|' + key; if (!cache.has(k)) { const d = DATES[key]; cache.set(k, eng.dayProfile(i, d.y, d.m, d.d, 15)); }
  return cache.get(k);
}
const seaCache = new Map();
function seaRays(i) { if (!seaCache.has(i)) seaCache.set(i, eng.seaProfile(i)); return seaCache.get(i); }

// ---------- harita ----------
const featB = () => ({ type: 'FeatureCollection', features: B.map((b, i) => ({ type: 'Feature', id: i, properties: { h: eng.B[i].h, sun: PRE[i][0], sea: PRE[i][1] }, geometry: { type: 'Polygon', coordinates: [b.r] } })) });
const map = new maplibregl.Map({
  container: 'map',
  style: { version: 8, sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': css('--land') } }] },
  center: [29.0262, 40.9842], zoom: 16.15, pitch: 58, bearing: -24, maxPitch: 75, attributionControl: false
});
map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: '© OpenStreetMap katkıcıları, Copernicus DEM, İBB Açık Veri' }), 'bottom-right');

function colors() {
  return {
    land: css('--land'), road: css('--road'), roadEdge: css('--road-edge'), park: css('--park'), sea: css('--sea'), bld: css('--bld'), shade: css('--shade'),
    ink: css('--ink'), saffron: css('--saffron'), cobalt: css('--cobalt'),
    sun: [css('--sun0'), css('--sun2'), css('--sun4'), css('--sun6'), css('--sun8')], sv0: css('--seaview0'), sv1: css('--seaview1'), sv2: css('--seaview2')
  };
}
function bldColor(C) {
  const sel = ['boolean', ['feature-state', 'sel'], false];
  let base;
  if (S.mode === 'gunes') base = ['interpolate', ['linear'], ['get', 'sun'], 0, C.sun[0], 2, C.sun[1], 4, C.sun[2], 6, C.sun[3], 8, C.sun[4]];
  else if (S.mode === 'deniz') base = ['step', ['get', 'sea'], C.sv0, 2, C.sv1, 25, C.sv2];
  else base = C.bld;
  return ['case', sel, C.ink, base];
}
function paint() {
  const C = colors();
  map.setPaintProperty('bg', 'background-color', C.land);
  map.setPaintProperty('sea', 'fill-color', C.sea);
  map.setPaintProperty('green', 'fill-color', C.park);
  map.setPaintProperty('roads-major', 'line-color', C.road);
  map.setPaintProperty('roads-minor', 'line-color', C.road);
  map.setPaintProperty('paths', 'line-color', C.roadEdge);
  map.setPaintProperty('shadows', 'fill-color', C.shade);
  map.setPaintProperty('bld', 'fill-extrusion-color', bldColor(C));
  map.setPaintProperty('slab', 'fill-extrusion-color', C.saffron);
  map.setPaintProperty('border', 'line-color', C.ink);
}
function lineFC(cls) {
  return { type: 'FeatureCollection', features: DATA.roads.filter(r => cls.includes(r.c)).map(r => ({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: r.g } })) };
}
let ready = false;
function pad() { map.setPadding(innerWidth <= 760 ? { top: 150, bottom: Math.round(innerHeight * .46), left: 0, right: 0 } : { left: 430, top: 60, bottom: 90, right: 0 }); }
addEventListener('resize', pad);
const EMPTY = { type: 'FeatureCollection', features: [] };
let markers = [];
map.on('load', () => {
  ready = true; pad();
  const C = colors();
  ['sea', 'green', 'rmaj', 'rmin', 'rpath', 'shadows', 'bld', 'slab', 'border'].forEach(id => map.addSource(id, { type: 'geojson', data: EMPTY }));
  map.addLayer({ id: 'sea', type: 'fill', source: 'sea', paint: { 'fill-color': C.sea } });
  map.addLayer({ id: 'green', type: 'fill', source: 'green', paint: { 'fill-color': C.park } });
  map.addLayer({ id: 'paths', type: 'line', source: 'rpath', minzoom: 14.5, paint: { 'line-color': C.roadEdge, 'line-width': ['interpolate', ['linear'], ['zoom'], 15, .5, 18, 2] } });
  map.addLayer({ id: 'roads-minor', type: 'line', source: 'rmin', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': C.road, 'line-width': ['interpolate', ['linear'], ['zoom'], 12, .5, 16, 4, 18, 12] } });
  map.addLayer({ id: 'roads-major', type: 'line', source: 'rmaj', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': C.road, 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 1.5, 16, 7, 18, 20] } });
  map.addLayer({ id: 'border', type: 'line', source: 'border', paint: { 'line-color': C.ink, 'line-width': 2, 'line-opacity': .55, 'line-dasharray': [3, 2] } });
  map.addLayer({ id: 'shadows', type: 'fill', source: 'shadows', paint: { 'fill-color': C.shade, 'fill-opacity': .8 } });
  map.addLayer({ id: 'bld', type: 'fill-extrusion', source: 'bld', paint: { 'fill-extrusion-color': bldColor(C), 'fill-extrusion-height': ['get', 'h'], 'fill-extrusion-base': 0, 'fill-extrusion-opacity': .96, 'fill-extrusion-vertical-gradient': true } });
  map.addLayer({ id: 'slab', type: 'fill-extrusion', source: 'slab', paint: { 'fill-extrusion-color': C.saffron, 'fill-extrusion-height': ['get', 'top'], 'fill-extrusion-base': ['get', 'base'], 'fill-extrusion-opacity': 1 } });
  map.on('moveend', () => updateSun());
  map.on('click', 'bld', e => { const f = e.features[0]; if (f) select(f.id, { fly: false }); });
  map.on('mouseenter', 'bld', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'bld', () => map.getCanvas().style.cursor = '');
  setMode(S.mode);
  activate(S.dist);
});

async function activate(key) {
  renderDists(key);
  $('#loading').textContent = DISTRICTS.find(x => x.key === key).name + ' yükleniyor';
  $('#loading').hidden = false;
  let st;
  try { st = await loadData(key); }
  catch (err) { $('#loading').textContent = err.message + '. Sayfayı yenileyip tekrar dene.'; return; }
  $('#loading').hidden = true;
  if (playing) { cancelAnimationFrame(playing); playing = 0; $('#play-ic').setAttribute('d', 'M4 2.5v11l9-5.5z'); }
  S.dist = key; try { localStorage.setItem('evk-dist', key); history.replaceState(null, '', '#' + key); } catch (e) {}
  DATA = st.d; eng = st.e; B = DATA.b; PRE = DATA.pre; CEN = st.cen; IDX = st.idx;
  cache.clear(); seaCache.clear(); prevSel = null; hits = []; $('#results').hidden = true; $('#q').value = '';
  map.setMaxBounds(null);
  map.getSource('sea').setData({ type: 'FeatureCollection', features: DATA.sea.map(r => ({ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [r] } })) });
  map.getSource('green').setData({ type: 'FeatureCollection', features: DATA.green.map(g => ({ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [g.g] } })) });
  map.getSource('rmaj').setData(lineFC(['major'])); map.getSource('rmin').setData(lineFC(['minor'])); map.getSource('rpath').setData(lineFC(['path']));
  map.getSource('bld').setData(featB());
  map.getSource('border').setData({ type: 'FeatureCollection', features: (DATA.border || []).map(r => ({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: r } })) });
  markers.forEach(m => m.remove()); markers = [];
  const seen = new Set(), placed = [];
  const near = (a, b) => Math.hypot((a[0] - b[0]) * 84000, (a[1] - b[1]) * 111000) < 220;
  DATA.stations.forEach(s => {
    const label = s.n.replace(/ \(.*\)/, '');
    if (seen.has(label) || placed.some(q => near(q, s.xy))) return; seen.add(label); placed.push(s.xy);
    const el = document.createElement('div'); el.className = 'pin' + (s.k === 'ferry' ? ' ferry' : '');
    el.innerHTML = '<i></i>' + esc(label);
    markers.push(new maplibregl.Marker({ element: el, anchor: 'bottom', offset: [0, -6] }).setLngLat(s.xy).addTo(map));
  });
  (DATA.places || []).forEach(([n, lo, la]) => {
    const el = document.createElement('div'); el.className = 'place'; el.textContent = n;
    markers.push(new maplibregl.Marker({ element: el }).setLngLat([lo, la]).addTo(map));
  });
  S.sel = Math.max(0, B.findIndex(b => b.id === DATA.sampleId)); S.sample = true;
  const b0 = eng.B[S.sel];
  map.jumpTo({ center: eng.INV((b0.minx + b0.maxx) / 2, (b0.miny + b0.maxy) / 2), zoom: 16.15, bearing: DATA.key === 'kadikoy' ? -24 : -10, pitch: 58 });
  map.setMaxBounds(DATA.bounds);
  select(S.sel, { fly: false, keepSample: true });
  $('#legend').innerHTML = LEG[S.mode]();
  updateSun();
}
function renderDists(key) {
  const cur = DISTRICTS.find(x => x.key === key);
  $('#distName').textContent = cur ? cur.name : 'İlçe seç';
  const byName = Object.fromEntries(DISTRICTS.map(x => [x.name.replace('â', 'a'), x]));
  $('#distPop').innerHTML = `<h3>İlçe seç</h3><p>${DISTRICTS.length === ALL_DISTRICTS.length ? 'Kayıt oranı: OpenStreetMap\'teki bina sayısının İBB 2017 sayımına oranı.' : DISTRICTS.length + ' ilçe hazır, diğerleri sırayla ekleniyor.'}</p><div class="distgrid">` +
    ALL_DISTRICTS.map(n => { const d = byName[n]; return d ? `<button data-dist="${d.key}" aria-current="${d.key === key}">${n}<small class="num">${d.n.toLocaleString('tr-TR')} bina${d.cov ? `, kayıt %${Math.min(d.cov, 100)}` : ''}</small></button>` : `<button disabled>${n}<small>sırada</small></button>`; }).join('') + '</div>';
}
function togglePop(open) { $('#distPop').hidden = !open; $('#distBtn').setAttribute('aria-expanded', open); }
$('#distBtn').addEventListener('click', e => { e.stopPropagation(); togglePop($('#distPop').hidden); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-dist]');
  if (b) { togglePop(false); if (b.dataset.dist !== S.dist) activate(b.dataset.dist); return; }
  if (!e.target.closest('#distPop')) togglePop(false);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') togglePop(false); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (ready) paint(); });
new MutationObserver(() => { if (ready) paint(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

let prevSel = null;
function slabFC() {
  const i = S.sel, b = eng.B[i], k = S.floor;
  const cx = (b.minx + b.maxx) / 2, cy = (b.miny + b.maxy) / 2;
  const ring = b.xs.map((x, j) => {
    const dx = x - cx, dy = b.ys[j] - cy, r = Math.hypot(dx, dy) || 1, f = (r + .9) / r;
    return eng.INV(cx + dx * f, cy + dy * f);
  }); ring.push(ring[0]);
  return { type: 'FeatureCollection', features: [{ type: 'Feature', properties: { base: k * 3 + .3, top: k * 3 + 3 }, geometry: { type: 'Polygon', coordinates: [ring] } }] };
}

// ---------- güneş & gölge ----------
function sunNow() { const d = DATES[S.date]; return eng.sun(EvEngine.localMs(d.y, d.m, d.d, Math.floor(S.mins / 60), S.mins % 60)); }
let raf = 0;
function updateSun() {
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    const s = sunNow();
    $('#clock').textContent = hm(S.mins);
    $('#sunread').textContent = s.alt > 0 ? `güneş ${Math.round(s.alt)}°, ${LOC[dirName(s.az)]}` : 'güneş ufkun altında';
    $('#t').value = S.mins;
    if (!ready) return;
    const feats = [];
    if (s.alt > 0.5) {
      const bd = map.getBounds(), pad = .004, w = bd.getWest() - pad, e = bd.getEast() + pad, so = bd.getSouth() - pad, n = bd.getNorth() + pad;
      for (let i = 0; i < eng.B.length; i++) {
        const c = CEN[i]; if (c[0] < w || c[0] > e || c[1] < so || c[1] > n) continue;
        const r = eng.shadowHull(i, s); if (r) feats.push({ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [r] } });
      }
    }
    map.getSource('shadows').setData({ type: 'FeatureCollection', features: feats });
    map.setLight({ anchor: 'map', position: [1.4, s.az, Math.min(88, Math.max(10, 90 - s.alt))], color: s.alt > 0 ? '#FFFAF0' : '#9AA4D6', intensity: s.alt > 0 ? .42 : .2 });
    const m = document.querySelector('#strip-now'); if (m) { const x = (S.mins - 300) / 960 * 320; m.setAttribute('x1', x); m.setAttribute('x2', x); }
  });
}
$('#t').addEventListener('input', e => { S.mins = +e.target.value; updateSun(); });
let playing = 0;
$('#play').addEventListener('click', () => {
  if (playing) { cancelAnimationFrame(playing); playing = 0; $('#play-ic').setAttribute('d', 'M4 2.5v11l9-5.5z'); return; }
  if (S.mins >= 1250) S.mins = 330;
  $('#play-ic').setAttribute('d', 'M4 2.5h3v11H4zM9 2.5h3v11H9z');
  const step = () => { S.mins = Math.min(1260, S.mins + 3); updateSun(); if (S.mins < 1260) playing = requestAnimationFrame(step); else { playing = 0; $('#play-ic').setAttribute('d', 'M4 2.5v11l9-5.5z'); } };
  playing = requestAnimationFrame(step);
});
function renderDates() {
  $('#dates').innerHTML = Object.entries(DATES).map(([k, d]) => `<button data-date="${k}" aria-pressed="${S.date === k}">${d.label}</button>`).join('');
}
function setDate(k) { S.date = k; renderDates(); updateSun(); renderPanel(); }
document.addEventListener('click', e => { const b = e.target.closest('[data-date]'); if (b) setDate(b.dataset.date); });

// ---------- modlar ----------
const LEG = {
  golge: () => 'Seçili saatte yere düşen gölgeler. Alttaki şeritten tarihi ve saati değiştir.',
  gunes: () => `<div>21 Aralık, orta kat, en çok güneş alan cephe</div><div class="ramp"></div><div class="ends num"><span>0 sa</span><span>4 sa</span><span>8 sa ve üstü</span></div>`,
  deniz: () => `<div>En üst kattan denizin görüldüğü açı${DATA && DATA.seaRange > 5000 ? '. Uzak görünümler yaklaşıktır.' : ''}</div><div class="sw"><span><i style="background:var(--seaview0)"></i>Görmez</span><span><i style="background:var(--seaview1)"></i>25°'ye kadar</span><span><i style="background:var(--seaview2)"></i>25° ve üstü</span></div>`
};
function setMode(m) {
  S.mode = m; try { localStorage.setItem('evk-mode', m); } catch (e) {}
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
  $('#legend').innerHTML = LEG[m]();
  if (ready) { map.setPaintProperty('bld', 'fill-extrusion-color', bldColor(colors())); map.setLayoutProperty('shadows', 'visibility', m === 'golge' ? 'visible' : 'none'); }
}
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

// ---------- seçim ----------
function select(i, opt = {}) {
  if (prevSel !== null) map.setFeatureState({ source: 'bld', id: prevSel }, { sel: false });
  S.sel = i; prevSel = i; if (!opt.keepSample) S.sample = false;
  map.setFeatureState({ source: 'bld', id: i }, { sel: true });
  const lv = B[i].lv;
  S.floor = Math.min(lv - 1, Math.max(0, Math.floor((lv - 1) / 2)));
  if (opt.fly) { const b = eng.B[i]; map.easeTo({ center: eng.INV((b.minx + b.maxx) / 2, (b.miny + b.maxy) / 2), zoom: Math.max(map.getZoom(), 16.6), duration: 900 }); }
  renderPanel();
  if (innerWidth <= 760 && !opt.keepSample) { S.open = false; $('#sheet').classList.remove('open'); }
}
function setFloor(k) { S.floor = k; renderPanel(); }
function setLevels(n) {
  const i = S.sel; n = Math.max(1, Math.min(40, n));
  applyLevels(i, n); B[i].e = 2; fixes[B[i].id] = n;
  try { localStorage.setItem('evk-fixes', JSON.stringify(fixes)); } catch (e) {}
  cache.clear(); seaCache.clear();
  const p = eng.dayProfile(i, 2026, 12, 21, 20); PRE[i] = [eng.floorSun(i, p, Math.floor((n - 1) / 2)).any, eng.floorSea(i, eng.seaProfile(i), n - 1).deg];
  map.getSource('bld').setData(featB());
  map.setFeatureState({ source: 'bld', id: i }, { sel: true });
  S.floor = Math.min(S.floor, n - 1);
  renderPanel(); updateSun();
}

// ---------- notlar ----------
function gSun(h) { return h >= 6 ? 5 : h >= 4 ? 4 : h >= 2.5 ? 3 : h >= 1 ? 2 : 1; }
function gSea(d, near) { const g = d >= 60 ? 5 : d >= 25 ? 4 : d >= 8 ? 3 : d > 0 ? 2 : 1; return near && near > 3000 ? Math.min(g, 3) : g; }
function gTransit(m) { return m <= 5 ? 5 : m <= 9 ? 4 : m <= 14 ? 3 : m <= 20 ? 2 : 1; }
function gDaily(m) { return m <= 3 ? 5 : m <= 5 ? 4 : m <= 8 ? 3 : m <= 12 ? 2 : 1; }
function gQuake(r) { return r < 1.5 ? 5 : r < 2.2 ? 4 : r < 3.5 ? 3 : r < 5 ? 2 : 1; }
const gradeBox = g => `<div class="grade g${g}"><strong>${g}</strong><small>${GRADE[g]}</small></div>`;

function sunColor(h) {
  const C = colors().sun, t = Math.min(h, 8) / 2, i = Math.min(3, Math.floor(t)), f = t - i;
  const p = c => [1, 3, 5].map(j => parseInt(c.slice(j, j + 2), 16));
  const a = p(C[i]), b = p(C[i + 1]);
  return `rgb(${a.map((v, j) => Math.round(v + (b[j] - v) * f)).join(',')})`;
}

function stripSVG(i, P, k) {
  const z = eng.floorZ(i, k), w = 320, x = m => (m - 300) / 960 * w, cw = P.step / 960 * w;
  let r = `<rect x="0" y="0" width="${w}" height="26" rx="6" fill="var(--night)"/>`;
  P.times.forEach((t, j) => {
    const lit = P.S.some(col => z > col[j]);
    r += `<rect x="${x(t.mins).toFixed(2)}" y="0" width="${(cw + .3).toFixed(2)}" height="26" fill="${lit ? 'var(--saffron)' : 'var(--strip-shade)'}"/>`;
  });
  const nx = x(S.mins);
  r += `<line id="strip-now" x1="${nx}" x2="${nx}" y1="-3" y2="29" stroke="var(--ink)" stroke-width="2"/>`;
  return `<svg class="strip" viewBox="0 -3 ${w} 32" role="img" aria-label="Gün boyunca güneş alma şeridi">${r}</svg>`;
}
function compassSVG(per) {
  const c = 56, R = 42, pt = (az, r) => [c + r * Math.sin(az * Math.PI / 180), c - r * Math.cos(az * Math.PI / 180)];
  let s = `<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="var(--line)" stroke-width="10"/>`;
  per.forEach(f => {
    const a0 = f.az - 16, a1 = f.az + 16, [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R);
    s += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${f.hours > 0 ? sunColor(f.hours) : 'var(--strip-shade)'}" stroke-width="10"/>`;
  });
  s += `<text x="${c}" y="10" text-anchor="middle">K</text><text x="${c}" y="${2 * c - 2}" text-anchor="middle">G</text><text x="${2 * c - 4}" y="${c + 3.5}" text-anchor="middle">D</text><text x="4" y="${c + 3.5}" text-anchor="middle">B</text>`;
  s += `<rect x="${c - 9}" y="${c - 9}" width="18" height="18" rx="3" fill="var(--ink)"/>`;
  return `<svg class="compass" viewBox="0 0 ${2 * c} ${2 * c}" role="img" aria-label="Cephelere göre güneş">${s}</svg>`;
}
function seaSVG(bins) {
  const c = 56, R = 44, pt = (az, r) => [c + r * Math.sin(az * Math.PI / 180), c - r * Math.cos(az * Math.PI / 180)];
  let s = `<circle cx="${c}" cy="${c}" r="${R}" fill="var(--surface-2)"/>`;
  // ardışık kutuları birleştir
  const runs = []; bins.forEach(a => { const l = runs[runs.length - 1]; if (l && a - l[1] <= 2) l[1] = a; else runs.push([a, a]); });
  if (runs.length > 1 && runs[0][0] === 0 && runs[runs.length - 1][1] === 358) { runs[0][0] = runs[runs.length - 1][0] - 360; runs.pop(); }
  runs.forEach(([a, b]) => {
    const [x0, y0] = pt(a - 1, R), [x1, y1] = pt(b + 1, R), large = (b - a + 2) > 180 ? 1 : 0;
    s += `<path d="M${c} ${c}L${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="var(--cobalt)"/>`;
  });
  s += `<text x="${c}" y="10" text-anchor="middle">K</text><rect x="${c - 7}" y="${c - 7}" width="14" height="14" rx="3" fill="var(--ink)"/>`;
  return `<svg class="compass" viewBox="0 0 ${2 * c} ${2 * c}" role="img" aria-label="Denizin görüldüğü yönler">${s}</svg>`;
}

function renderPanel() {
  const i = S.sel, b = B[i], k = S.floor, lv = b.lv;
  const P = prof(i, S.date), PW = prof(i, 'aralik');
  const rays = seaRays(i);
  const fsNow = eng.floorSun(i, P, k), fsW = eng.floorSun(i, PW, k), sea = eng.floorSea(i, rays, k);
  const lms = eng.landmarks(i, k, DATA.landmarks || []);
  const ms = DATA.mah[b.m];
  const w = b.w || {};
  // kat kesiti
  const dayLen = P.times.length * P.step / 60 || 1;
  const fh = Math.max(13, Math.min(26, Math.floor(230 / lv)));
  let floorsHTML = '';
  for (let f = lv - 1; f >= 0; f--) {
    const h = eng.floorSun(i, P, f).any, sd = eng.floorSea(i, rays, f).deg;
    floorsHTML += `<button class="floor" style="--fh:${fh}px;--w:${Math.max(3, h / dayLen * 100).toFixed(1)}%;--c:${sunColor(h)}" aria-pressed="${f === k}" data-floor="${f}" aria-label="${kname(f)}: ${dur(h)} güneş${sd > 0 ? ', deniz görür' : ''}">
      <span class="lab num">${fh >= 15 || f === 0 || f === k || f % 5 === 0 ? (f === 0 ? 'Z' : f) : ''}</span><span class="track"><span class="bar"></span>${sd > 0 ? `<svg class="wave" viewBox="0 0 16 8" aria-hidden="true"><path d="M1 5c2-3 3-3 5 0s3 3 5 0 3-3 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>` : ''}</span></button>`;
  }
  // notlar
  const gs = gSun(fsW.any), gv = gSea(sea.deg, sea.near);
  const tr = Math.min(w.rail ? w.rail[0] : 99, w.ferry ? w.ferry[0] : 99);
  const gt = gTransit(tr);
  const dl = ['market', 'pharmacy', 'park'].map(c => w[c] ? w[c][0] : 20);
  const gd = gDaily(dl.reduce((a, c) => a + c, 0) / 3);
  const gq = ms ? gQuake(ms.ratio) : null;
  const grades = [gs, gv, gt, gd, gq].filter(g => g !== null), avg = grades.reduce((a, c) => a + c, 0) / grades.length;
  const belge = avg >= 4.25 ? ['takdir', 'Takdir belgesi aldı'] : avg >= 3.5 ? ['tesekkur', 'Teşekkür belgesi aldı'] : ['', 'Belge yok, sınıfı geçti'];
  const bestW = fsW.best;
  const lit = P.S.length ? P.times.filter((t, j) => P.S.some(col => eng.floorZ(i, k) > col[j])) : [];
  const title = b.a || b.nm || (b.nr ? b.nr + ' üzerinde' : 'Adı kayıtlı olmayan bina');
  const srcTxt = b.e === 2 ? 'Kat sayısını sen düzelttin' : b.e === 1 ? `Tahmini kat sayısı (%${DATA.acc.pm1} ihtimalle ±1 kat), düzeltebilirsin` : 'Kat sayısı OSM kaydından';
  const walkRows = [
    ['rail', 'Raylı sistem'], ['ferry', 'Vapur'], ['tram', 'Nostaljik tramvay'], ['market', 'Market veya fırın'],
    ['pharmacy', 'Eczane'], ['school', 'Okul veya kreş'], ['park', 'Park'], ['hospital', 'Sağlık kuruluşu']
  ].filter(([c]) => w[c]).map(([c, l]) => `<li><div>${l}${w[c][1] && !['Park', 'Okul', 'Eczane', 'Market', 'Fırın', 'Hastane'].includes(w[c][1]) ? `<small>${esc(w[c][1])}</small>` : ''}</div><div class="min num">${Math.max(1, Math.round(w[c][0]))}<span>dk</span></div></li>`).join('');
  const seaTxt = sea.deg > 0 ? `${sea.deg}° açıyla, ${dirName(sea.dir)} yönünde` : 'Görmüyor';
  const ageTot = ms ? ms.total : 1;

  $('#panel').innerHTML = `
  <div class="head">
    <div class="where">${esc(b.m ? b.m + ' Mahallesi, ' + DATA.name : DATA.name)}</div>
    <h1>${esc(title)}</h1>
    ${S.sample ? `<div class="sample">Örnek bina. Haritada istediğin binaya dokun ya da yukarıdan adres ara.</div>` : ''}
    <div class="kat-row">
      <div class="stepper"><button id="lv-minus" aria-label="Kat sayısını azalt">−</button><output class="num" id="lv-out">${lv} katlı</output><button id="lv-plus" aria-label="Kat sayısını artır">+</button></div>
      <span class="src ${b.e === 1 ? 'est' : ''}">${srcTxt}</span>
    </div>
    <div class="src src-line">Bina tabanı OpenStreetMap'ten${b.y ? `, son düzenleme ${b.y}` : ''}${b.y && b.y < 2020 ? '. Bina o tarihten sonra yenilendiyse kat sayısını düzelt.' : ''}</div>
  </div>

  <div class="kesit">
    <div><div class="floors" role="group" aria-label="Kat seç">${floorsHTML}</div><div class="ground-line"></div></div>
    <div class="fsum">
      <div class="kname">${kname(k)}</div>
      <dl>
        <div><dt>${DATES[S.date].label} güneş</dt><dd class="num">${dur(fsNow.any)}</dd></div>
        <div><dt>Deniz</dt><dd>${seaTxt}</dd></div>
      </dl>
    </div>
    <div class="kesit-note">Çubuk uzunluğu o katın ${S.date === 'bugun' ? 'bugün' : DATES[S.date].label + ' günü'} aldığı güneş. Dalga işareti denizi gören katlar.</div>
  </div>

  <section class="sec">
    <h2>Karne</h2>
    <p class="sub">${kname(k)} için, beş ders üzerinden</p>
    <div class="karne">
      <div class="krow"><div><b>Kış güneşi</b><span>21 Aralık'ta ${dur(fsW.any)}${bestW && bestW.hours > 0 ? `, en çok ${dirName(bestW.az)} cepheden` : ''}</span></div>${gradeBox(gs)}</div>
      <div class="krow"><div><b>Deniz manzarası</b><span>${sea.deg > 0 ? `Denizi ${sea.deg}° açıyla görür${sea.near > 3000 ? ' (uzaktan, yaklaşık)' : ''}${lms.length ? ', ' + esc(lms[0].name) + ' dahil' : ''}` : 'Bu kattan deniz görünmüyor'}</span></div>${gradeBox(gv)}</div>
      <div class="krow"><div><b>Ulaşım</b><span>${w.rail ? `Raylı sisteme ${Math.round(w.rail[0])} dk` : 'Raylı sistem uzak'}${w.ferry ? `, iskeleye ${Math.round(w.ferry[0])} dk yürüme` : ''}</span></div>${gradeBox(gt)}</div>
      <div class="krow"><div><b>Gündelik ihtiyaç</b><span>Market ${Math.round(dl[0])} dk, eczane ${Math.round(dl[1])} dk, park ${Math.round(dl[2])} dk</span></div>${gradeBox(gd)}</div>
      <div class="krow"><div><b>Deprem riski</b><span>${ms ? `Mahallede ağır hasar beklenen bina oranı %${fmt1(ms.ratio)}` : 'Bu mahalle İBB 2017 verisinde yok (yeni kurulmuş ya da adı değişmiş), nota katılmadı'}</span></div>${gq ? gradeBox(gq) : '<div class="grade"><strong>–</strong><small>Veri yok</small></div>'}</div>
    </div>
    <div class="avg"><div><div class="n num">${fmt1(avg)}</div></div><div class="belge ${belge[0]}">${belge[1]}<small>5 üzerinden ortalama${grades.length < 5 ? ', 4 ders' : ''}</small></div></div>
  </section>

  <section class="sec">
    <h2>Güneş</h2>
    <p class="sub">Doğrudan güneş, komşu binaların ve yamacın gölgesi hesaba katılarak</p>
    <div class="tabs" role="group" aria-label="Tarih">${Object.entries(DATES).map(([kk, d]) => `<button data-date="${kk}" aria-pressed="${S.date === kk}">${d.label}</button>`).join('')}</div>
    ${stripSVG(i, P, k)}
    <div class="strip-ticks num"><span>05</span><span>09</span><span>13</span><span>17</span><span>21</span></div>
    <div class="keys"><span><i style="background:var(--saffron)"></i>Güneş alıyor</span><span><i style="background:var(--strip-shade)"></i>Gölgede</span><span><i style="background:var(--night)"></i>Güneş yok</span></div>
    <div class="sunline">
      ${compassSVG(fsNow.per)}
      <div class="facts">
        <div>Toplam <strong class="num">${dur(fsNow.any)}</strong>${P.times.length ? ` (gün ışığı ${dur(P.times.length * P.step / 60)})` : ''}</div>
        ${lit.length ? `<div>İlk güneş <strong class="num">${hm(lit[0].mins)}</strong>, son güneş <strong class="num">${hm(lit[lit.length - 1].mins + P.step)}</strong></div>` : '<div>Bu tarihte bu kata doğrudan güneş düşmüyor.</div>'}
        ${fsNow.best && fsNow.best.hours > 0 ? `<div>En aydınlık cephe <strong>${dirName(fsNow.best.az)}</strong>, ${dur(fsNow.best.hours)}</div>` : ''}
      </div>
    </div>
  </section>

  <section class="sec">
    <h2>Manzara</h2>
    <p class="sub">Pencereden ufka bakış, binalar ve arazi engel olarak sayıldı</p>
    <div class="sunline">
      ${seaSVG(sea.bins)}
      <div class="facts">
        ${sea.deg > 0 ? `<div>Deniz <strong>${sea.deg}°</strong> açıyla, ağırlıklı olarak <strong>${dirName(sea.dir)}</strong> yönünde</div><div>En yakın kıyı <strong class="num">${sea.near > 3000 ? fmt1(sea.near / 1000) + ' km' : Math.round(sea.near / 10) * 10 + ' m'}</strong></div>${sea.near > 3000 ? `<div>Uzak görünüm. İlçe dışındaki binalar uydu yüzey modeliyle yaklaşık hesaplandı, gerçekte daha az görünebilir. Bu yüzden not en fazla 3.</div>` : ''}` : `<div>Bu kattan deniz görünmüyor.${(() => { for (let f = k + 1; f < lv; f++) if (eng.floorSea(i, rays, f).deg > 0) return ` <strong>${kname(f)}</strong> ve üstü denizi görüyor.`; return ''; })()}</div>`}
      </div>
    </div>
    <div class="chips">${lms.length ? lms.map(l => `<span class="chip on">${esc(l.name)}</span>`).join('') : '<span class="chip">Görüş hattında simge yapı yok</span>'}</div>
  </section>

  <section class="sec">
    <h2>Yürüme mesafesi</h2>
    <p class="sub">Sokak ağı üzerinden, dakikada 80 metre</p>
    <ul class="walk">${walkRows}</ul>
  </section>

  <section class="sec">
    <h2>Deprem</h2>
    <p class="sub">Mahalle düzeyinde. Bu binaya özel bir değerlendirme değil.</p>
    ${ms ? `
    <div class="big-stat"><strong class="num">%${fmt1(ms.ratio)}</strong><span>bina ağır veya çok ağır hasar görüyor</span></div>
    <p class="note" style="margin-top:4px">İBB'nin Mw 7,5 gece senaryosunda ${esc(b.m)} için. İstanbul'daki mahallelerin ortancası %${fmt1(DATA.ist_median)}.</p>
    <div class="age"><i style="width:${ms.pre80 / ageTot * 100}%;background:var(--g1)"></i><i style="width:${ms.y80_00 / ageTot * 100}%;background:var(--g3)"></i><i style="width:${ms.post00 / ageTot * 100}%;background:var(--g4)"></i></div>
    <div class="agekeys num"><span>1980 öncesi %${Math.round(ms.pre80 / ageTot * 100)}</span><span>1980–2000 %${Math.round(ms.y80_00 / ageTot * 100)}</span><span>2000 sonrası %${Math.round(ms.post00 / ageTot * 100)}</span></div>
    <p class="note">Binanın kendi yapım yılı ve zemin etüdü için belediyeye ya da bir uzmana başvur. En yakın toplanma alanını e-Devlet'teki AFAD Acil Toplanma Alanı sorgusundan öğrenebilirsin.</p>` : '<p class="note">Bu mahalle İBB\'nin 2017 deprem senaryosu verisinde yer almıyor. Muhtemelen o tarihten sonra kurulmuş ya da adı değişmiş.</p>'}
  </section>

  <div class="about">
    <p><strong>Nasıl hesaplandı?</strong> Bina tabanları ve kat sayıları OpenStreetMap'ten, arazi yüksekliği Copernicus GLO-30'dan. Her cephe ve her 15 dakika için güneşe doğru ışın gönderilip önündeki bina ve yamaçlar kontrol edildi. ${esc(DATA.acc.note)} Kat sayısı kayıtlı ${DATA.acc.n.toLocaleString('tr-TR')} binada test edildiğinde tahmin %${DATA.acc.exact} tam isabet, %${DATA.acc.pm1} ±1 kat içinde. Kat yüksekliği 3 m kabul edildi.</p>
    ${ms && ms.osm ? `<p><strong>Veri ne kadar eksiksiz?</strong> ${esc(b.m)} için OpenStreetMap'te ${ms.osm.toLocaleString('tr-TR')} bina var. İBB'nin 2017 MAKS sayımında ${ms.total.toLocaleString('tr-TR')} bina görünüyor (%${Math.round(ms.osm / ms.total * 100)}). Fark, kayıt eksikliğinden ya da 2017'den sonra yıkılıp birleştirilen parsellerden kaynaklanabilir.</p>` : ''}
    <p>Deprem ve bina yaşı: İBB Açık Veri Portalı (Deprem Senaryosu Analiz Sonuçları, 2017 Mahalle Bazlı Bina Sayıları).</p>
    <p>Bu bir ön inceleme aracıdır, ekspertiz ya da zemin etüdünün yerine geçmez.</p>
  </div>`;

  $('#panel').querySelectorAll('[data-floor]').forEach(el => el.addEventListener('click', () => setFloor(+el.dataset.floor)));
  $('#lv-minus').onclick = () => setLevels(lv - 1);
  $('#lv-plus').onclick = () => setLevels(lv + 1);
  if (ready) map.getSource('slab').setData(slabFC());
}

// ---------- arama ----------
const norm = s => (s || '').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\u0131/g, 'i').replace(/\s+/g, ' ');
let hits = [], hi = 0;
function search(q) {
  const n = norm(q).trim(); const box = $('#results');
  if (n.length < 2) { box.hidden = true; return; }
  const parts = n.split(' ');
  hits = IDX.filter(x => parts.every(p => x.t.includes(p))).slice(0, 7); hi = 0;
  box.innerHTML = hits.length ? hits.map((h, j) => `<button data-hit="${j}" class="${j === 0 ? 'on' : ''}">${esc(B[h.i].a || B[h.i].nm)}<small>${esc(B[h.i].m || '')} Mahallesi</small></button>`).join('') : '<div style="padding:10px 12px;color:var(--ink-3);font-size:13.5px">Bu adla kayıtlı bina yok. Sokak adını kısaltıp tekrar dene.</div>';
  box.hidden = false;
}
function pick(j) { const h = hits[j]; if (!h) return; $('#results').hidden = true; $('#q').value = B[h.i].a || B[h.i].nm; select(h.i, { fly: true }); }
$('#q').addEventListener('input', e => search(e.target.value));
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { pick(hi); e.preventDefault(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    hi = Math.max(0, Math.min(hits.length - 1, hi + (e.key === 'ArrowDown' ? 1 : -1)));
    document.querySelectorAll('[data-hit]').forEach((b, j) => b.classList.toggle('on', j === hi)); e.preventDefault();
  }
  if (e.key === 'Escape') $('#results').hidden = true;
});
$('#results').addEventListener('click', e => { const b = e.target.closest('[data-hit]'); if (b) pick(+b.dataset.hit); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#results').hidden = true; });

// mobil sayfa
$('#grab').addEventListener('click', () => { S.open = !S.open; $('#sheet').classList.toggle('open', S.open); $('#grab').setAttribute('aria-label', S.open ? 'Karneyi küçült' : 'Karneyi genişlet'); });

renderDates();
$('#legend').innerHTML = LEG[S.mode]();
document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === S.mode));
$('#t').value = S.mins;
renderDists(S.dist);
})();
</script>

</html>
